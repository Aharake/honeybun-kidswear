<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeybun Kidswear</title>
    <meta name="description" content="Sweet, comfy kidswear for little ones, sized 1 to 14 years. Cash on delivery." />

    <!-- Start the connection to the shop's database and photos right away -->
    <link rel="preconnect" href="https://sarmqglowwdnaalbindd.supabase.co" crossorigin />

      rel="preload"
      as="image"
      href="/hero-800.webp"
      imagesrcset="/hero-800.webp 800w, /hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
